<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction History – Bank</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Bank</h1>
    <div>Welcome, User | <a href="login.html" style="color:#fff;">Logout</a></div>
  </header>
  <nav class="sidebar">
    <a href="dashboard.html">Dashboard</a>
    <a href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="transfer.html">Transfer</a>
    <a href="transactions.html" class="active">Transaction History</a>
  </nav>
  <main class="main-content">
    <h2>Transaction History</h2>
    <form id="filterForm" style="margin-bottom:16px;">
      <label for="startDate">From</label>
      <input type="date" id="startDate" name="startDate" />

      <label for="endDate">To</label>
      <input type="date" id="endDate" name="endDate" />

      <label for="type">Type</label>
      <select id="type" name="type">
        <option value="all">All</option>
        <option value="credit">Credit (+)</option>
        <option value="debit">Debit (-)</option>
      </select>

      <button type="submit" class="secondary" style="margin-top:8px;">Apply Filters</button>
    </form>
    <table id="transactionsTable">
      <thead>
        <tr><th>Date</th><th>Description</th><th>Type</th><th class="amount">Amount</th><th>Balance</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="5">Loading transactions from MySQL database...</td></tr>
      </tbody>
    </table>
    <p id="noResults" style="display:none; color:var(--color-secondary-text);">No transactions match the selected criteria.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
