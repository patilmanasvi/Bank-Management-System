<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Bank</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Bank</h1>
    <div><span id="dashboardUser">Welcome, User | </span><a href="login.html" style="color:#fff;">Logout</a></div>
  </header>
  <nav class="sidebar">
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="transfer.html">Transfer</a>
    <a href="transactions.html">Transaction History</a>
  </nav>
  <main class="main-content">
    <section>
      <h2>Account Balance</h2>
      <p id="dashboardBalance" style="font-size:24px; font-weight:bold; color:#0b6623;">₹ 80,000.00</p>
    </section>
    <section>
      <h2>Recent Transactions</h2>
      <table id="recentTransactions">
        <thead>
          <tr><th>Date</th><th>Description</th><th class="amount">Amount</th><th>Balance</th></tr>
        </thead>
        <tbody>
          <tr><td colspan="4">Loading recent transactions from database...</td></tr>
        </tbody>
      </table>
      <p><a href="transactions.html">View all transactions</a></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
