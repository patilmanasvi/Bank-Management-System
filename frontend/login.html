<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Bank</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Bank</h1>
  </header>
  <main class="main-content" style="max-width: 400px; margin: 40px auto;">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <label for="role">Login as</label>
      <select id="role" name="role" required>
        <option value="customer">Customer</option>
        <option value="employee">Employee</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit">Sign In</button>
    </form>

  <p style="margin-top:12px;">Don't have an account? <a href="signup.html">Create one</a></p>
  <div style="margin-top:20px; font-size:13px; color:#333; background:#f0f4f8; border:1px solid #d0dbe5; padding:12px; border-radius:6px; line-height:1.6;">
    <strong>Demo Test Credentials:</strong><br>
    Customer: <code>customer@example.com</code> / <code>password123</code><br>
    Employee: <code>employee@example.com</code> / <code>password123</code><br>
    Admin: <code>admin@example.com</code> / <code>password123</code>
  </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
