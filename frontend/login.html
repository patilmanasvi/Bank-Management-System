<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Bank Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background: linear-gradient(135deg, #eef2f7 0%, #dce3eb 100%); min-height: 100vh;">
  <header>
    <h1>Bank Management System</h1>
  </header>
  <main style="max-width: 420px; margin: 48px auto; padding: 0 16px;">
    <div style="background: #fff; padding: 32px 28px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); border: 1px solid #dde2e8;">
      <h2 style="text-align: center; border-bottom: none; padding-bottom: 4px; margin-bottom: 6px;">Sign In</h2>
      <p style="text-align: center; color: #5B6B7E; font-size: 13px; margin-bottom: 22px;">Enter your credentials to access your account</p>
      <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="e.g. customer@example.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />

        <label for="role">Login as</label>
        <select id="role" name="role" required>
          <option value="customer">Customer</option>
          <option value="employee">Employee</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit" style="width: 100%; padding: 11px; margin-top: 4px; font-size: 15px;">Sign In</button>
      </form>

      <p style="margin-top: 16px; text-align: center; font-size: 13px; color: #5B6B7E;">
        Don't have an account? <a href="signup.html">Create one</a>
      </p>
    </div>

    <div style="margin-top: 20px; font-size: 12px; color: #5B6B7E; background: #fff; border: 1px solid #dde2e8; padding: 14px 18px; border-radius: 8px; line-height: 1.8;">
      <strong style="font-size: 13px; color: #0B2545;">Demo Credentials</strong><br>
      Customer: <code style="background: #f0f3f6; padding: 1px 5px; border-radius: 3px;">customer@example.com</code> / <code style="background: #f0f3f6; padding: 1px 5px; border-radius: 3px;">password123</code><br>
      Employee: <code style="background: #f0f3f6; padding: 1px 5px; border-radius: 3px;">employee@example.com</code> / <code style="background: #f0f3f6; padding: 1px 5px; border-radius: 3px;">password123</code><br>
      Admin: <code style="background: #f0f3f6; padding: 1px 5px; border-radius: 3px;">admin@example.com</code> / <code style="background: #f0f3f6; padding: 1px 5px; border-radius: 3px;">password123</code>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
