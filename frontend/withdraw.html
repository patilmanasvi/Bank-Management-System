<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdraw - Bank</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Bank</h1>
    <div>Welcome, User | <a href="login.html" style="color:#fff;">Logout</a></div>
  </header>
  <nav class="sidebar">
    <a href="dashboard.html">Dashboard</a>
    <a href="deposit.html">Deposit</a>
    <a href="withdraw.html" class="active">Withdraw</a>
    <a href="transfer.html">Transfer</a>
    <a href="transactions.html">Transaction History</a>
  </nav>
  <main class="main-content">
    <h2>Withdraw Funds</h2>
    <form id="withdrawForm">
      <label for="account">Account Number</label>
      <input type="text" id="account" name="account" required />

      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" name="amount" min="0" step="0.01" required />

      <button type="submit">Withdraw</button>
    </form>
    <p id="msg" class="success" style="display:none; margin-top:12px;"></p>
  </main>
  <script>
    document.getElementById('withdrawForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const acct = document.getElementById('account').value.trim();
      const amt = parseFloat(document.getElementById('amount').value);
      if (!acct || isNaN(amt) || amt <= 0) {
        document.getElementById('msg').textContent = 'Please provide valid details.';
        document.getElementById('msg').className = 'error';
        document.getElementById('msg').style.display = 'block';
        return;
      }
      // Placeholder for real API call
      document.getElementById('msg').textContent = `₹ ${amt.toFixed(2)} withdrawn from ${acct}.`;
      document.getElementById('msg').className = 'success';
      document.getElementById('msg').style.display = 'block';
      this.reset();
    });
  </script>
</body>
</html>
