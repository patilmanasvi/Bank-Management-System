<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deposit – Bank</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Bank</h1>
    <div>Welcome, User | <a href="login.html" style="color:#fff;">Logout</a></div>
  </header>
  <nav class="sidebar">
    <a href="dashboard.html">Dashboard</a>
    <a href="deposit.html" class="active">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="transfer.html">Transfer</a>
    <a href="transactions.html">Transaction History</a>
  </nav>
  <main class="main-content">
    <h2>Deposit Funds</h2>
    <form id="depositForm">
      <label for="account">Account Number</label>
      <input type="text" id="account" name="account" value="ACC100101" readonly />

      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" name="amount" min="1" step="0.01" placeholder="Enter deposit amount" required />

      <button type="submit">Deposit</button>
    </form>
    <p id="msg" class="success" style="display:none; margin-top:12px;"></p>
  </main>
  <script src="app.js"></script>
  <script>
    const u = getSession();
    if (u && u.accountNumber) document.getElementById('account').value = u.accountNumber;
  </script>
</body>
</html>
