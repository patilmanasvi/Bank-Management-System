<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deposit – Bank Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Bank Management System</h1>
    <div>
      <span id="headerRoleBadge" class="badge active" style="margin-right:6px;">CUSTOMER</span>
      <span id="headerUser">Welcome, User | </span>
      <a href="login.html" id="btnLogout">Logout</a>
    </div>
  </header>
  <nav class="sidebar" id="mainSidebar"></nav>
  <main class="main-content">
    <h2>Deposit Funds</h2>
    <p style="color:var(--color-secondary-text); margin-bottom: 20px; font-size: 14px;">
      Credit funds into your active bank account. Balance updates immediately in the database.
    </p>
    <form id="depositForm" style="max-width: 480px;">
      <label for="account">Account Number</label>
      <input type="text" id="account" name="account" value="ACC100101" readonly />

      <label for="amount">Amount (INR)</label>
      <input type="number" id="amount" name="amount" min="1" step="0.01" placeholder="Enter deposit amount" required />

      <button type="submit" style="width: 100%; margin-top: 4px;">Deposit</button>
    </form>
    <p id="msg" class="success" style="display:none; margin-top:14px; max-width: 480px;"></p>
  </main>
  <script src="app.js"></script>
  <script>
    const u = getSession();
    if (u && u.accountNumber) document.getElementById('account').value = u.accountNumber;
  </script>
</body>
</html>
