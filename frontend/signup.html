<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Bank</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Bank</h1>
  </header>
  <main class="main-content" style="max-width: 400px; margin: 40px auto;">
    <h2>Create Account</h2>
    <form id="signupForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <label for="role">Account type</label>
      <select id="role" name="role" required>
        <option value="customer">Customer</option>
        <option value="employee">Employee</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit">Register</button>
    </form>
    <p style="margin-top:12px;">Already have an account? <a href="login.html">Sign in</a></p>
  </main>
  <script>
    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // In a real app, send data to backend and on success redirect to login.
      alert('Account created – you can now log in.');
      location.href = 'login.html';
    });
  </script>
</body>
</html>
